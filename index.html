<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BULLGYM · San Juan de los Jarros</title>
<style>
:root{--bg:#0a0a0a;--card:#161616;--line:#2a2a2a;--tx:#f4f4f4;--mu:#a3a3a3;--red:#e10600}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--tx)}
nav{position:sticky;top:0;z-index:5;background:#000d;backdrop-filter:blur(8px);display:flex;gap:4px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);overflow-x:auto}
nav img{height:38px;margin-right:8px}nav a{color:var(--tx);padding:8px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;font-weight:600;font-size:14px}
nav a:hover,nav a.on{background:var(--red)}main{max-width:980px;margin:auto;padding:20px 16px 60px}
h1,h2,h3{text-transform:uppercase;letter-spacing:.5px;margin:.4em 0}h2{border-left:5px solid var(--red);padding-left:10px}
.hero{text-align:center;padding:20px 0}.hero img{max-width:260px;width:70%}.hero p{color:var(--mu);max-width:520px;margin:8px auto 18px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.c{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.price{font-size:42px;font-weight:800;color:var(--red)}.mu{color:var(--mu)}
button,.btn{background:var(--red);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;font-size:15px;text-decoration:none;display:inline-block}
button.s{background:#333}input,select,textarea{width:100%;background:#0d0d0d;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:10px;margin:4px 0 10px;font:inherit}
textarea{min-height:110px}label{font-size:13px;color:var(--mu)}.ok{background:#12301a;border:1px solid #2e7d46;border-radius:10px;padding:12px;margin:10px 0}
.tag{background:var(--red);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700}pre{white-space:pre-wrap;font:inherit}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{border-bottom:1px solid var(--line);padding:6px;text-align:left}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.tabs button{background:#222}.tabs button.on{background:var(--red)}
.ch{max-height:260px;overflow:auto;background:#0d0d0d;border-radius:10px;padding:8px;margin-bottom:8px}.m{margin:6px 0;padding:6px 10px;border-radius:10px;background:#222;max-width:85%}.m.me{background:#4a1210;margin-left:auto}
footer{text-align:center;color:var(--mu);font-size:13px;padding:20px}footer a{color:var(--mu);cursor:pointer}
</style></head><body>

async function call(q){if(!API)return local(q);try{return await (await fetch(API,{method:"POST",body:JSON.stringify(q)})).json()}catch(e){return{err:"Sin conexión con el servidor"}}}
let S={cfg:DEF,v:"inicio",me:null,adm:null,tab:"datos",sel:null,ap:"",msg:""};
const V=[["inicio","Inicio"],["promos","Promociones"],["asesoria","Asesorías"],["registro","Inscríbete"],["cuenta","Mi cuenta"]];
function go(v){S.v=v;S.msg="";draw();scrollTo(0,0)}
const tel=()=>S.cfg.phone.replace(/\D/g,"");
function draw(){
 $("#nav").innerHTML=`<img src="${LOGO}" alt="BULLGYM">`+V.map(([k,n])=>`<a class="${S.v==k?"on":""}" onclick="go('${k}')">${n}</a>`).join("");
 $("#ft").innerHTML=`© BULLGYM · ${esc(S.cfg.addr)}<br><a onclick="go('admin')">Administrador</a>`;
 $("#app").innerHTML=(VW[S.v]||VW.inicio)();
}
const promos=()=>S.cfg.promos.map(p=>`<div class="c"><span class="tag">PROMO</span><h3>${esc(p.t)}</h3><p class="mu">${esc(p.d)}</p></div>`).join("")||`<p class="mu">Pronto habrá nuevas promociones.</p>`;
const VW={
inicio:()=>`<div class="hero"><img src="${LOGO}" alt="BULLGYM"><p>Entrena con fuerza en San Juan de los Jarros. Asesoría en línea y presencial con el coach ${esc(S.cfg.trainers[0]?.n||"")}.</p><button onclick="go('registro')">Inscríbete ahora</button> <a class="btn s" href="https://wa.me/${tel()}" target="_blank" rel="noopener">WhatsApp</a></div>
<h2>Precios</h2><div class="g"><div class="c"><div class="mu">Mensualidad</div><div class="price">$${esc(S.cfg.price)}</div></div><div class="c"><div class="mu">Inscripción</div><div class="price">$${esc(S.cfg.ins)}</div></div></div>
<h2>Promociones</h2><div class="g">${promos()}</div>
<h2>Horarios y contacto</h2><div class="g"><div class="c"><h3>Horarios</h3>${S.cfg.hours.map(h=>`<div>${esc(h)}</div>`).join("")}</div>
<div class="c"><h3>Ubicación</h3>${esc(S.cfg.addr)}<br><a style="color:#ff6b66" target="_blank" rel="noopener" href="https://www.google.com/maps/search/${encodeURIComponent(S.cfg.addr)}">Ver en mapa</a></div>
<div class="c"><h3>Contacto</h3>${esc(S.cfg.phone)}<br>${S.cfg.ig.map(i=>`<a style="color:#ff6b66" target="_blank" rel="noopener" href="https://instagram.com/${esc(i)}">@${esc(i)}</a>`).join("<br>")}</div></div>`,
promos:()=>`<h2>Promociones</h2><div class="g">${promos()}</div>`,
asesoria:()=>`<h2>Asesorías</h2><div class="g"><div class="c"><h3>Presencial</h3><p class="mu">Rutina y corrección de técnica directamente en el gimnasio con tu coach.</p></div><div class="c"><h3>En línea</h3><p class="mu">Recibe tu rutina en tu panel privado y escribe a tu coach desde ahí.</p></div></div>
<h2>Entrenadores</h2><div class="g">${S.cfg.trainers.map(t=>`<div class="c"><h3>${esc(t.n)}</h3><span class="tag">${esc(t.r)}</span><p class="mu">${esc(t.b)}</p></div>`).join("")}</div>
<h2>Recomendaciones</h2><div class="c">${S.cfg.tips.map(t=>`<div>• ${esc(t)}</div>`).join("")}</div>`,
registro:()=>`<h2>Inscripción</h2><div class="c"><p class="mu">Mensualidad $${esc(S.cfg.price)} · Inscripción $${esc(S.cfg.ins)}. Al registrarte recibirás tu usuario y contraseña.</p>
<label>Nombre completo</label><input id="rn"><label>Teléfono</label><input id="rp" type="tel"><label>Correo (opcional)</label><input id="re" type="email">
<label>Objetivo</label><select id="rg"><option>Bajar de peso</option><option>Ganar masa muscular</option><option>Tonificar</option><option>Salud y condición</option></select>
<label>Asesoría</label><select id="rm"><option>Presencial</option><option>En línea</option></select><button onclick="reg()">Registrarme</button>${S.msg}</div>`,
cuenta:()=>S.me?acct():`<h2>Mi cuenta</h2><div class="c"><label>Usuario</label><input id="lu" autocapitalize="none"><label>Contraseña</label><input id="lp" type="password"><button onclick="login()">Entrar</button>${S.msg}</div>`,
admin:()=>S.adm?adminUI():`<h2>Administrador</h2><div class="c"><label>Clave de administrador</label><input id="ak" type="password"><button onclick="alogin()">Entrar</button>${S.msg}</div>`};
async function reg(){const q={a:"reg",name:$("#rn").value.trim(),phone:$("#rp").value.trim(),email:$("#re").value.trim(),goal:$("#rg").value,mode:$("#rm").value};
 if(!q.name||!q.phone){S.msg=`<p>Escribe tu nombre y teléfono.</p>`;return draw()}
 const r=await call(q);S.msg=r.err?`<p>${esc(r.err)}</p>`:`<div class="ok"><b>¡Listo!</b> Guarda tus datos para entrar a Mi cuenta:<br>Usuario: <b>${esc(r.user)}</b><br>Contraseña: <b>${esc(r.pass)}</b></div>`;draw()}
async function login(){const u=$("#lu").value.trim(),p=$("#lp").value;const r=await call({a:"login",u,p});if(r.err){S.msg=`<p>${esc(r.err)}</p>`}else{S.me={...r,u,p};S.cfg=r.cfg||S.cfg;S.msg=""}draw()}
function acct(){const{c,ms}=S.me,a=S.cfg.account||{};return`<h2>Hola, ${esc(c.name)}</h2><div class="g"><div class="c"><h3>Mi rutina</h3><pre>${esc(c.routine)||"Tu coach aún no asigna tu rutina."}</pre></div><div class="c"><h3>Mi asesoría (${esc(c.mode)})</h3><pre>${esc(c.advice)||"Sin indicaciones por ahora."}</pre><p>Estado: <b>${esc(c.estado)}</b></p></div></div>
<h2>Pagos</h2><div class="c">Banco: ${esc(a.banco)||"—"}<br>Titular: ${esc(a.titular)||"—"}<br>Cuenta / CLABE: ${esc(a.cuenta)||"—"}<br>Concepto: ${esc(a.concepto)}</div>
<h2>Mensajes con tu coach</h2>${chat(ms,"c")}<input id="cm" placeholder="Escribe tu mensaje"><button onclick="send()">Enviar</button> <button class="s" onclick="refresh()">Actualizar</button> <button class="s" onclick="S.me=null;draw()">Salir</button>`}
const chat=(ms,me)=>`<div class="ch">${ms.map(m=>`<div class="m ${m.from==me?"me":""}">${esc(m.t)}<div class="mu" style="font-size:11px">${esc(m.d)}</div></div>`).join("")||'<span class="mu">Sin mensajes</span>'}</div>`;
async function send(){const t=$("#cm").value.trim();if(!t)return;await call({a:"msg",u:S.me.u,p:S.me.p,t});refresh()}
async function refresh(){const r=await call({a:"login",u:S.me.u,p:S.me.p});if(!r.err)S.me={...r,u:S.me.u,p:S.me.p};draw()}
async function alogin(){const ap=$("#ak").value;const r=await call({a:"adm",ap});if(r.err){S.msg=`<p>${esc(r.err)}</p>`}else{S.adm=r;S.ap=ap;S.cfg=r.cfg||S.cfg;S.msg=""}draw()}
function adminUI(){const T=[["datos","Precios y datos"],["promos","Promociones"],["coach","Entrenadores"],["pago","Cuenta de pago"],["tips","Recomendaciones"],["cli","Clientes"]];
 return`<h2>Panel de administrador</h2><div class="tabs">${T.map(([k,n])=>`<button class="${S.tab==k?"on":""}" onclick="collect();S.tab='${k}';draw()">${n}</button>`).join("")}<button class="s" onclick="S.adm=null;draw()">Salir</button></div><div class="c">${AT[S.tab]()}${S.msg}</div>`}
const f=(k,l,v,t="text")=>`<label>${l}</label><input type="${t}" data-k="${k}" value="${esc(v)}">`;
const ta=(k,l,v)=>`<label>${l}</label><textarea data-k="${k}">${esc(v)}</textarea>`;
const sv=`<button onclick="saveCfg()">Guardar y publicar cambios</button>`;
const AT={datos:()=>f("price","Mensualidad ($)",S.cfg.price,"number")+f("ins","Inscripción ($)",S.cfg.ins,"number")+f("addr","Ubicación",S.cfg.addr)+f("phone","Teléfono",S.cfg.phone)+ta("hours","Horarios (uno por línea)",S.cfg.hours.join("\n"))+f("ig","Instagram (separados por coma)",S.cfg.ig.join(", "))+sv,
promos:()=>ta("promos","Una promoción por línea: Título | Descripción (borra la línea para quitarla)",S.cfg.promos.map(p=>p.t+" | "+p.d).join("\n"))+sv,
coach:()=>ta("trainers","Un entrenador por línea: Nombre | Puesto | Descripción",S.cfg.trainers.map(t=>[t.n,t.r,t.b].join(" | ")).join("\n"))+sv,
pago:()=>["banco:Banco","titular:Titular","cuenta:Número de cuenta / CLABE / tarjeta","concepto:Concepto de pago"].map(x=>{const[k,l]=x.split(":");return f("acc."+k,l,S.cfg.account[k]||"")}).join("")+`<p class="mu">Solo tú lo editas; se muestra a los clientes dentro de su panel privado.</p>`+sv,
tips:()=>ta("tips","Recomendaciones (una por línea)",S.cfg.tips.join("\n"))+sv,
cli:()=>{const cl=S.adm.cl,x=cl.find(c=>c.id==S.sel);return`<button class="s" onclick="csv()">Descargar Excel (CSV)</button><div style="overflow:auto"><table><tr><th>Nombre</th><th>Usuario</th><th>Contraseña</th><th>Asesoría</th><th>Estado</th><th></th></tr>${cl.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.user)}</td><td>${esc(c.pass)}</td><td>${esc(c.mode)}</td><td>${esc(c.estado)}</td><td><button class="s" onclick="S.sel=${+c.id};draw()">Abrir</button></td></tr>`).join("")||'<tr><td colspan=6 class="mu">Aún no hay clientes</td></tr>'}</table></div>`+
 (x?`<h3>${esc(x.name)} · ${esc(x.phone)} · ${esc(x.goal)}</h3><label>Rutina asignada</label><textarea id="xr">${esc(x.routine)}</textarea><label>Asesoría / indicaciones</label><textarea id="xa">${esc(x.advice)}</textarea><label>Estado</label><select id="xe">${["Activo","Baja","Regresó"].map(o=>`<option ${o==x.estado?"selected":""}>${o}</option>`).join("")}</select><button onclick="saveCli(${+x.id})">Guardar cliente</button>
 <h3>Mensajes</h3>${chat(S.adm.ms.filter(m=>m.u==x.user),"a")}<input id="am" placeholder="Responder"><button onclick="asend('${esc(x.user)}')">Enviar</button>`:"")}};
function collect(){const c=S.cfg;document.querySelectorAll("[data-k]").forEach(e=>{const k=e.dataset.k,v=e.value,ls=()=>v.split("\n").map(s=>s.trim()).filter(Boolean);
 if(k=="price"||k=="ins")c[k]=+v||0;else if(k=="hours"||k=="tips")c[k]=ls();else if(k=="ig")c.ig=v.split(",").map(s=>s.trim().replace("@","")).filter(Boolean);
 else if(k=="promos")c.promos=ls().map(s=>{const[t,...d]=s.split("|");return{t:t.trim(),d:d.join("|").trim()}});
 else if(k=="trainers")c.trainers=ls().map(s=>{const[n,r,...b]=s.split("|");return{n:n.trim(),r:(r||"").trim(),b:b.join("|").trim()}});
 else if(k.startsWith("acc."))c.account[k.slice(4)]=v;else c[k]=v})}
async function saveCfg(){collect();const r=await call({a:"setcfg",ap:S.ap,cfg:S.cfg});S.msg=r.err?`<p>${esc(r.err)}</p>`:`<div class="ok">Cambios guardados. Ya se ven en la página.</div>`;draw()}
async function saveCli(id){const r=await call({a:"setcli",ap:S.ap,id,f:{routine:$("#xr").value,advice:$("#xa").value,estado:$("#xe").value}});S.adm=await call({a:"adm",ap:S.ap});S.msg=r.err?`<p>${esc(r.err)}</p>`:`<div class="ok">Cliente actualizado.</div>`;draw()}
async function asend(u){const t=$("#am").value.trim();if(!t)return;await call({a:"msg",ap:S.ap,u,t});S.adm=await call({a:"adm",ap:S.ap});draw()}
function csv(){const k=["name","phone","email","goal","mode","user","pass","date","routine","advice","estado"];
 const t="\ufeff"+[k.join(",")].concat(S.adm.cl.map(c=>k.map(x=>'"'+String(c[x]??"").replace(/"/g,'""')+'"').join(","))).join("\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/csv"}));a.download="BULLGYM_clientes.csv";a.click()}
call({a:"cfg"}).then(r=>{if(r.cfg)S.cfg={...DEF,...r.cfg};draw()});draw();
</script></body></html>
